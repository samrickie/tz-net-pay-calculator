name: Build lightweight Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: apk-build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copy calculator into Android assets
        run: |
          mkdir -p android-app/app/src/main/assets
          cp index.html android-app/app/src/main/assets/index.html

      - name: Build APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon

      - name: Publish APK into repository
        run: |
          mkdir -p downloads
          cp android-app/app/build/outputs/apk/debug/app-debug.apk downloads/Tanzania-Net-Pay-Calculator.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add downloads/Tanzania-Net-Pay-Calculator.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Build latest lightweight Android APK"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Tanzania-Net-Pay-Calculator-APK
          path: downloads/Tanzania-Net-Pay-Calculator.apk
